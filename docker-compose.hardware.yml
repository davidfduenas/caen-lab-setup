# Overlay that gives the daq container access to the USB hardware and (optionally) your X display.
# Use together with the main file:
#   docker compose -f docker-compose.yml -f docker-compose.hardware.yml up -d
# Linux hosts only. The HV serial port name must already exist on the host (udev rule, see SETUP.md).
services:
  daq:
    devices:
      - /dev/bus/usb:/dev/bus/usb
      - /dev/ttyDT5471P0:/dev/ttyDT5471P0
    environment:
      DISPLAY: ${DISPLAY:-:0}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
